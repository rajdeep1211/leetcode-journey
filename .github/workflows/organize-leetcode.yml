name: Organize LeetCode Solutions

concurrency:
  group: leetcode-organization
  cancel-in-progress: false

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Organize LeetCode problems
        run: python automation/organize.py

      - name: Update progress dashboard
        run: python automation/update_dashboard.py

      - name: Fix LeetHub table links
        run: python automation/fix_leethub_links.py

      - name: Sync solving notes
        run: python automation/sync_notes.py

      - name: Commit organized problems
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Organize LeetCode solutions"
            git push
          fi
